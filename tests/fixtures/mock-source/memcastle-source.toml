[source]
name = "mock-wasm"
version = "0.1.0"
description = "Deterministic synthetic documents for Core lifecycle tests"

[compatibility]
contract = "0.4"
memcastle = ">=0.2"

[capabilities]
incremental = true
retains_raw = false
needs_credentials = false

# The guest never reads files; the grant exists to test consent and permission changes.
[permissions.filesystem]
read = ["locator"]

[build]
command = ["cargo", "build", "--release", "--target", "wasm32-wasip2", "--target-dir", "target"]
output = "target/wasm32-wasip2/release/memcastle_test_mock_source.wasm"
