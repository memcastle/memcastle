name: Download a verified Core binary
description: Fetch the tested development build or an exact stable release for plugin CI
inputs:
  version:
    description: main or an exact Core release tag
    required: true
outputs:
  binary:
    description: Absolute path to the verified Linux amd64 executable
    value: ${{ steps.download.outputs.binary }}
  core_sha:
    description: Source SHA for main, or the exact stable version tag
    value: ${{ steps.download.outputs.core_sha }}
runs:
  using: composite
  steps:
    - id: download
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [[ "$VERSION" == main ]]; then
          release=development
          metadata="$(gh release view "$release" --repo memcastle/memcastle --json body,isDraft,isPrerelease)"
          [[ "$(jq -r '.isDraft == false and .isPrerelease == true' <<< "$metadata")" == true ]] || exit 1
          sha="$(jq -r '.body | capture("Core main SHA: (?<sha>[0-9a-f]{40})").sha' <<< "$metadata")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          name="memcastle_${sha}_linux-amd64"
          sums="SHA256SUMS_${sha}"
        else
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Core versions must be exact stable tags'; exit 1; }
          release="$VERSION"
          metadata="$(gh release view "$release" --repo memcastle/memcastle --json isDraft,isPrerelease)"
          [[ "$(jq -r '.isDraft == false and .isPrerelease == false' <<< "$metadata")" == true ]] || exit 1
          sha="$VERSION"
          name="memcastle_${VERSION}_linux-amd64"
          sums=SHA256SUMS
        fi
        dest="$RUNNER_TEMP/core-${sha}"
        mkdir -p "$dest"
        gh release download "$release" --repo memcastle/memcastle --pattern "$name" --dir "$dest"
        gh release download "$release" --repo memcastle/memcastle --pattern "$sums" --dir "$dest"
        # Verify the exact asset, not an unrelated checksum entry in a larger release.
        (cd "$dest" && awk -v name="$name" '$2 == name { print }' "$sums" | sha256sum --check --status)
        chmod +x "$dest/$name"
        echo "binary=$dest/$name" >> "$GITHUB_OUTPUT"
        echo "core_sha=$sha" >> "$GITHUB_OUTPUT"
        echo "MEMCASTLE_BIN=$dest/$name" >> "$GITHUB_ENV"
