name: Development Core binaries

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUSTFLAGS: -D warnings
  RUSTUP_TOOLCHAIN: "1.98.1"

jobs:
  build:
    name: Build linux-amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5
      - name: Reproducible build paths and date
        shell: bash
        run: |
          remap="--remap-path-prefix=${GITHUB_WORKSPACE}=/build"
          remap="${remap} --remap-path-prefix=${CARGO_HOME:-${HOME}/.cargo}=/cargo"
          remap="${remap} --remap-path-prefix=${RUSTUP_HOME:-${HOME}/.rustup}=/rustup"
          remap="${remap} --remap-path-prefix=/project=/build"
          {
            echo "RUSTFLAGS=${RUSTFLAGS} ${remap}"
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
          } >> "$GITHUB_ENV"
      - name: Build and smoke-test
        shell: bash
        run: |
          cross build --release --locked --target x86_64-unknown-linux-gnu
          target/x86_64-unknown-linux-gnu/release/memcastle --version
      - uses: actions/upload-artifact@v7
        with:
          name: development-linux-amd64
          path: target/x86_64-unknown-linux-gnu/release/memcastle
          if-no-files-found: error

  publish:
    name: Update development prerelease
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: core-development-release
      cancel-in-progress: false
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/development
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: development-linux-amd64
          path: dist
      - name: Name the development binary
        run: mv dist/memcastle dist/memcastle_linux-amd64
      - name: Publish a complete, current revision
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test -s dist/memcastle_linux-amd64
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$SHA" ]]; then
            echo '::notice::Newer main commit exists; keep the last completed prerelease.'
            exit 0
          fi
          (cd dist && sha256sum -- memcastle_linux-amd64 > SHA256SUMS)
          if release="$(gh release view development --json isPrerelease 2>/dev/null)"; then
            jq -e '.isPrerelease == true' <<< "$release" >/dev/null || {
              echo '::error::development tag belongs to a non-prerelease release'
              exit 1
            }
          else
            gh release create development --target "$SHA" --title 'Development (main)' \
              --notes 'Pending development binaries' --draft --prerelease
          fi
          # Label the binary before replacing either asset so clients reject a partially updated pair.
          gh release upload development "dist/memcastle_linux-amd64#${SHA}" dist/SHA256SUMS --clobber
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/development" --jq .id)"
          assets="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" --slurp)"
          jq -e --arg sha "$SHA" '
            [ .[][] | select(.name == "memcastle_linux-amd64" and .label == $sha and .size > 0) ] | length == 1
          ' <<< "$assets" >/dev/null
          jq -e '[ .[][] | select(.name == "SHA256SUMS" and .size > 0) ] | length == 1' <<< "$assets" >/dev/null
          # Once both uploaded assets exist, the body can advertise the completed build.
          gh release edit development --title 'Development (main)' \
            --notes "Core main SHA: ${SHA}" --prerelease --draft=false
          # GitHub's --clobber only replaces equal names; old SHAs and platforms need explicit removal.
          jq -r '.[][] | select(.name != "memcastle_linux-amd64" and .name != "SHA256SUMS") | .id' \
            <<< "$assets" | while IFS= read -r asset_id; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" --silent
            done
