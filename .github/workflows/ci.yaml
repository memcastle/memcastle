name: ♻️ CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# GitHub defaults Windows steps to pwsh, which neither stops at the first
# failing command nor reports anything but the last one's exit status — a
# multi-command step there fails silently and the job goes green. bash is
# present on all three runners and is invoked with `-e -o pipefail`.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

  # Shared action caching cannot reuse Cargo's private incremental state.
  CARGO_INCREMENTAL: "0"
  # lld-link ships with windows-latest (no install step) and links faster than link.exe; nextest links one binary
  # per test target, so this matters. Scoped to this triple, so it's a no-op on Linux/macOS — which already
  # defaults to Apple's own faster linker on Xcode 15+.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled matrix can upload only its early coverage reports, so main must
  # finish while superseded pull-request runs still yield fast feedback.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: 🕵️ Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The channel comes from the action ref, not rust-toolchain.toml,
      # and each job installs the components it needs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # mold links faster than GNU ld, and clippy still has to link every test/example target it type-checks.
      - uses: rui314/setup-mold@v1

      # Tool versions come from mise.toml + mise.lock, so CI runs exactly
      # what `mise run default` runs locally. No pinned mise version: an
      # incompatibility should surface here, not only on a contributor's
      # machine running whatever they already have.
      - uses: jdx/mise-action@v5
        with:
          cache: true

      # Includes Cargo downloads and target outputs; do not duplicate rust-cache.
      # Workload generations scope fallback restores too, unlike key suffixes.
      # PRs restore only: archiving large target trees delays feedback and churns the cache budget.
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: lint-v1

      # Run the same hooks as `git commit`, then the heavier Rust lint task
      # separately so committing does not require a Clippy compilation.
      - name: Run hooks
        run: prek run --all-files --show-diff-on-failure

      - name: Lint Rust
        run: mise run lint

      # Check the release configuration and its workflows before release day.
      - name: Install gh-ship
        run: gh extension install noirbizarre/gh-ship
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the release setup
        run: gh ship validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Basic behavior on every OS; expensive process-boundary and retrieval-baseline tests run in the Linux slow job.
  test:
    name: 🧪 Tests (${{ matrix.os.name }})
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            runner: ubuntu-latest
            flag: linux
          - name: Windows
            runner: windows-latest
            flag: windows
          - name: macOS
            runner: macos-latest
            flag: macos
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      # mold is Linux-only, so it only applies to this one leg of the matrix.
      - name: Install mold (faster Linux linker)
        if: matrix.os.flag == 'linux'
        uses: rui314/setup-mold@v1

      # nextest and llvm-cov are pinned by mise.lock rather than resolved
      # per-run, so a tool release cannot change CI behaviour on its own.
      - uses: jdx/mise-action@v5
        with:
          cache: true

      # Bootstrap tools first: mise installs on C: with a same-volume temporary rename.
      # Storage still precedes Cargo caches so their post hooks run before drive teardown.
      - name: Tune Windows runner
        uses: ./.github/actions/setup-windows
        if: runner.os == 'Windows'

      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: tests-${{ matrix.os.flag }}-v1

      - name: Verify Windows build storage
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/actions/setup-windows/verify.ps1

      - name: Run tests (with coverage)
        run: |
          # --no-report retains cached profiles unless they are explicitly cleaned first.
          cargo llvm-cov clean --workspace
          # nextest's filter skips execution, not linking; select only basic Cargo targets too.
          targets=(--lib --bin memcastle --test in_process)
          for file in tests/*.rs; do
            name="${file#tests/}"
            name="${name%.rs}"
            case "$name" in
              wasm_*|persistence|mcp_smoke|auth_lifecycle) ;;
              *) targets+=(--test "$name") ;;
            esac
          done
          cargo llvm-cov nextest --profile ci --no-report "${targets[@]}"
          cargo llvm-cov report --lcov --output-path lcov.info

      # Keep raw inputs even when a corrupt profile prevents generating lcov.info.
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os.flag }}-${{ github.run_attempt }}
          path: |
            lcov.info
            target/llvm-cov-target/*.profraw
            target/llvm-cov-target/*.profdata
            target/llvm-cov-target/*-profraw-list
          retention-days: 7
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          # Flagging each leg keeps the three reports distinguishable, so a
          # partial upload is visible rather than looking like a coverage drop.
          flags: ${{ matrix.os.flag }}

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          directory: target/nextest/ci
          report_type: test_results

  slow:
    name: 🐢 Process and retrieval tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: rui314/setup-mold@v1
      - uses: jdx/mise-action@v5
        with:
          cache: true
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: slow-v1
      - name: Run slow tests (with coverage)
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --profile ci-slow --no-report --features slow-tests --test persistence --test mcp_smoke --test auth_lifecycle --test in_process
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          flags: slow
      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          directory: target/nextest/ci-slow
          report_type: test_results

  # The WebAssembly suite: every `tests/wasm_*.rs` binary, which builds components with Cargo and runs them in the
  # sandbox. Linux only, by decision (issue #181): the basic suite still covers the host's unit tests on every OS.
  # It runs in parallel with the `test` matrix, so it only costs wall-clock time if it is the longest job.
  # This job is local to this repository; the template does not have it.
  wasm:
    name: 🧬 WebAssembly tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          # The test components are built for this target.
          targets: wasm32-wasip2
      - uses: rui314/setup-mold@v1

      - uses: jdx/mise-action@v5
        with:
          cache: true

      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: wasm-v1

      # If instrumenting breaks the `wasm32-wasip2` builds (`can't find crate for profiler_builtins` has been seen
      # locally), run this step with plain `cargo nextest run --profile ci-wasm` and drop the coverage steps.
      # `--test 'wasm_*'` is the `wasm_` prefix as a Cargo glob: without it every other test binary is compiled and
      # linked, instrumented, only for the profile's filter to skip it. Cargo still builds the `memcastle` binary these
      # tests start.
      - name: Run tests (with coverage)
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --profile ci-wasm --no-report --test 'wasm_*'
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          # What only this suite covers (`src/mining/wasm`, most of `src/source`) is reported under its own flag,
          # which `.github/codecov.yml` waits for before it posts.
          flags: wasm

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          directory: target/nextest/ci-wasm
          report_type: test_results

  # Core tests the maintained reference source explicitly; provider-owned sources run in their own repositories.
  sources:
    name: 🧩 Source (${{ matrix.source }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [directory]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: rui314/setup-mold@v1

      - uses: jdx/mise-action@v5
        with:
          cache: true

      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: core-build-v1

      # `sources:test` depends on `build`, so `memcastle` is built first, then runs `memcastle source test` on
      # the one source. The name goes through the environment, never into the script text.
      # With many sources, build `memcastle` once in a job of its own and share it as an artifact.
      - name: Build and test the source
        env:
          SOURCE: ${{ matrix.source }}
        run: mise run sources:test -- "$SOURCE"

  # The in-tree plugin is a packaging fixture, not a provider released from Core.
  example_plugin:
    name: 🧩 Example plugin tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: rui314/setup-mold@v1
      # This job builds through rustup directly rather than mise's Cargo wrapper.
      - uses: jdx/mr-boxington-action@v1
        with:
          version: 1.28.0
          cache-generation: example-plugin-v1

      - name: Check Core release selection tooling
        run: python3 -m unittest discover -s packaging/plugins

      - name: Build and package the example plugin
        run: |
          python3 plugins/example/scripts/package.py
          python3 -m unittest discover -s plugins/example/tests
          git diff --exit-code -- plugins/example/plugin.toml || {
            echo "::error::packaging must not change plugin.toml"
            exit 1
          }
          git diff --exit-code -- plugins/example/manifest.toml || {
            echo "::error::packaging must not change the checked-in manifest.toml"
            exit 1
          }
          (cd plugins/example/dist && for checksum in *.sha256sum; do sha256sum --check "$checksum"; done)
          for manifest in plugins/example/modules/*/memcastle-source.toml; do
            if [[ -f "$manifest" ]]; then
              lock="$(dirname "$manifest")/Cargo.lock"
              git ls-files --error-unmatch "$lock" >/dev/null || {
                echo "::error::commit $lock after packaging so release dependencies stay pinned"
                exit 1
              }
            fi
          done

      - name: Preserve compiled components when artifact digests disagree
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: example-plugin-components
          path: plugins/example/modules/*/source.wasm

  # The Core-shipped declarative integrations must install from a package and a checkout through the same local code.
  # Their agent assets are checked without needing a provider's build or client test suite.
  # This job is local to this repository; the template does not have it.
  integrations:
    name: 🔌 Integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1

      - uses: jdx/mise-action@v5
        with:
          cache: true

      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: core-build-v1

      # `build` is a dependency of the task, so the installer tests have a current binary.
      - name: Package and test the integrations
        run: mise run integrations:check

  # The web UI (docs/adr/035): typechecked, tested, built, packaged by the release's own script, and served by a
  # real daemon from an installed prefix and from the checkout. Its own job because it needs bun and node, which
  # `mise install` deliberately leaves out of [tools]. This job is local to this repository; the template does not
  # have it.
  web:
    name: 🏰 Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1

      - uses: jdx/mise-action@v5
        with:
          cache: true

      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: core-build-v1

      # `build` is a dependency of the task, so the debug binary the tests start is built first.
      - name: Typecheck, test and package the dashboard
        env:
          # Makes the task run `test:cover`, which writes lcov beside each package.
          COVERAGE: "1"
        run: mise run web:check

      # bun and vitest write paths relative to their own package (`src/audit-core.ts`), which Codecov cannot tell
      # apart from the daemon's own `src/`. Prefixing them makes each file unique.
      - name: Make the web coverage paths relative to the repository
        if: ${{ !cancelled() }}
        run: |
          for report in web/coverage/lcov.info; do
            package="$(dirname "$(dirname "$report")")"
            sed -i "s|^SF:|SF:$package/|" "$report"
          done

      - name: Upload web coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: web/coverage/lcov.info
          flags: web

  # The .deb and .rpm are otherwise first built by 📦 Publish Release, after the
  # tag exists, which is the worst moment to learn the nfpm config is broken.
  # Stub binaries are enough: nfpm only packages the bytes it is given. They
  # still answer `completions <shell>`, because build.sh runs the binary to
  # generate the completion files it packages and refuses an empty one.
  packaging:
    name: 📦 Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-nfpm

      - name: Build the packages from stub binaries
        run: |
          mkdir dist
          for asset in linux-amd64 linux-arm64; do
            cat > "dist/memcastle_0.0.0_${asset}" <<'STUB'
          #!/bin/sh
          echo "# stub completions for $2"
          STUB
          done
          # Core ships no source or integration modules; package only the real shared skills.
          packaging/integrations/build.sh integrations-bundle
          bash packaging/skills/archive.sh integrations-bundle dist 0.0.0
          # And for the dashboard (packaging/web/build.sh builds the real one, which tests/web_bundle.rs checks).
          mkdir -p web-bundle/web/dist/assets
          echo '<!doctype html>' > web-bundle/web/dist/index.html
          INTEGRATIONS_DIR="${PWD}/integrations-bundle" WEB_DIR="${PWD}/web-bundle" \
            packaging/nfpm/build.sh 0.0.0 dist

      - name: Check the shared skills release archive
        run: |
          tar -tzf dist/memcastle_0.0.0_skills.tar.gz > entries.txt
          grep -Fxq 'memcastle-skills-0.0.0/skills/wake-up/SKILL.md' entries.txt
          if grep -Eq '(^|/)(sources|integrations)/' entries.txt; then
            echo '::error::Core source or integration modules leaked into the skills archive'
            exit 1
          fi

      # Building without error is not enough: the binary must land where the
      # systemd unit expects it.
      - name: Check the package contents
        run: |
          for asset in linux-amd64 linux-arm64; do
            # Listed once: `grep -q` quits at its first match, and with `pipefail` the producer's broken pipe then
            # fails the step as the listing grows.
            dpkg-deb --contents "dist/memcastle_0.0.0_${asset}.deb" > contents.txt
            for file in usr/bin/memcastle \
                        usr/lib/systemd/user/memcastle.service \
                        usr/share/bash-completion/completions/memcastle \
                        usr/share/zsh/site-functions/_memcastle \
                        usr/share/fish/vendor_completions.d/memcastle.fish \
                        usr/share/memcastle/skills/wake-up/SKILL.md \
                        usr/share/memcastle/web/dist/index.html; do
              grep -q " ./${file}$" contents.txt || { echo "::error::${asset}: ${file} is not in the package"; exit 1; }
            done
            for dir in usr/share/memcastle/sources usr/share/memcastle/integrations; do
              grep -q " ./${dir}/$" contents.txt || { echo "::error::${asset}: empty ${dir} is missing"; exit 1; }
            done
          done

  # `rust-version` in Cargo.toml is a promise. Without a job that keeps it, it
  # drifts the first time anyone uses a newer language feature — and the
  # breakage surfaces in a user's build, not here.
  msrv:
    name: 🧓 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      # This job is Linux-only, so mold always applies (see the lint job).
      - uses: rui314/setup-mold@v1
      - uses: jdx/mr-boxington-action@v1
        with:
          version: 1.28.0
          cache-generation: msrv-v1

      # `check`, not `test`: dev-dependencies routinely require a newer
      # toolchain than the crate itself, and the MSRV is a promise about
      # consuming the library, not about developing it.
      - name: Check
        run: mbx check --all-targets

  # Link every target on PRs without paying release optimization/LTO costs.
  build:
    name: 🏗️ Build (${{ matrix.build.label }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.build.runner }}
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        build:
          - { label: linux-amd64, target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, cross: true }
          - { label: linux-arm64, target: aarch64-unknown-linux-gnu, runner: ubuntu-latest, cross: true }
          - { label: darwin-amd64, target: x86_64-apple-darwin, runner: macos-latest }
          - { label: darwin-arm64, target: aarch64-apple-darwin, runner: macos-latest }
          - { label: windows-amd64, target: x86_64-pc-windows-msvc, runner: windows-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.build.target }}
      # Bootstrap the toolchain before relocating temporary storage, but keep cache cleanup before drive teardown.
      - name: Tune Windows runner
        uses: ./.github/actions/setup-windows
        if: runner.os == 'Windows'
      # This PR-only workload restores compatible baselines without saving PR-scoped archives.
      - uses: jdx/mr-boxington-action@v1
        with:
          version: 1.28.0
          cache-generation: pr-build-${{ matrix.build.target }}-v1
      - uses: taiki-e/install-action@cross
        if: matrix.build.cross
      # Exercise the same CRT choice as downloaded Windows release binaries.
      - name: Statically link the MSVC C runtime
        if: endsWith(matrix.build.target, 'windows-msvc')
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C target-feature=+crt-static" >> "$GITHUB_ENV"
      - name: Verify Windows build storage
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/actions/setup-windows/verify.ps1
      - name: Build
        env:
          TARGET: ${{ matrix.build.target }}
          CROSS: ${{ matrix.build.cross }}
        run: |
          if [ "${CROSS:-}" = "true" ]; then
            cross build --locked --target "$TARGET"
          else
            mbx build --locked --target "$TARGET"
          fi

  development:
    name: 🧪 Publish tested development Core
    needs: [lint, test, slow, wasm, sources, example_plugin, integrations, web, packaging, msrv]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.lint.result == 'success' && needs.test.result == 'success' &&
      needs.slow.result == 'success' &&
      needs.wasm.result == 'success' && needs.sources.result == 'success' &&
      needs.example_plugin.result == 'success' && needs.integrations.result == 'success' &&
      needs.web.result == 'success' && needs.packaging.result == 'success' &&
      needs.msrv.result == 'success'
    uses: ./.github/workflows/development-release.yaml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
