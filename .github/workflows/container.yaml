name: 🐳 Container
run-name: 🐳 Container ${{ inputs.tag || github.event.release.tag_name }}

# gh-ship publishes the release only after its checksummed binaries and frontend are available.
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public stable release to package (no Rust rebuild)
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/memcastle/memcastle
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    name: 🐳 Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      GH_TOKEN: ${{ github.token }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Validate release
        run: |
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
            --jq '.isDraft == false and .isPrerelease == false' | grep -Fx true
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Download release inputs
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets \
            --pattern SHA256SUMS --pattern "memcastle_${TAG}_linux-${ARCH}" --pattern "memcastle_${TAG}_web.tar.gz"
          (cd release-assets && sha256sum --check --ignore-missing SHA256SUMS)
          mkdir release-web
          tar -xzf "release-assets/memcastle_${TAG}_web.tar.gz" --strip-components=2 -C release-web
      - uses: docker/metadata-action@v6
        id: meta
        with:
          context: git
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=semver,pattern={{version}},value=${{ env.TAG }}
      - uses: docker/setup-qemu-action@v4
        if: matrix.arch == 'arm64'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BIN=release-assets/memcastle_${{ env.TAG }}_linux-${{ matrix.arch }}
            WEB=release-web
          load: true
          tags: memcastle-container:test
          labels: ${{ steps.meta.outputs.labels }}
      - name: Check daemon status
        run: |
          trap 'docker logs memcastle; docker rm -f memcastle' EXIT
          docker run -d --platform "linux/$ARCH" --name memcastle -e MEMCASTLE_WEB_ENABLE=true \
            -p 127.0.0.1::8420 memcastle-container:test
          for _ in {1..30}; do
            if docker run --rm --platform "linux/$ARCH" --network container:memcastle memcastle-container:test status; then
              address="$(docker port memcastle 8420/tcp)"
              curl --fail --silent --show-error "http://$address/ui/" | cmp - release-web/index.html
              exit $?
            fi
            sleep 2
          done
          exit 1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Publish candidates by digest so the public tags wait for both platform checks.
      - uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BIN=release-assets/memcastle_${{ env.TAG }}_linux-${{ matrix.arch }}
            WEB=release-web
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Record image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: container-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  publish:
    name: Publish, sign and attest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    concurrency:
      group: container-publication
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: container-digest-*
          merge-multiple: true
          path: digests
      - name: Select latest alias
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resolve under the publication lock so retrying an old tag cannot roll latest back.
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [ "$latest" = "$TAG" ]; then echo "enable=true"; else echo "enable=false"; fi >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.enable }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        id: image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tags=()
          while IFS= read -r tag; do tags+=(--tag "$tag"); done <<< "$TAGS"
          images=()
          for digest in digests/*; do images+=("$IMAGE@sha256:${digest##*/}"); done
          docker buildx imagetools create "${tags[@]}" "${images[@]}"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v4
      - name: Sign the multi-platform image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
