name: 🧩 Provider plugins

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  providers-list:
    name: 📋 List the providers
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.list.outputs.providers }}
    steps:
      - uses: actions/checkout@v7
      - name: Check Core release selection
        run: python3 -m unittest discover -s packaging/plugins
      - name: List plugins/*/plugin.toml
        id: list
        run: |
          # Only a directory with a root manifest is a provider; unrelated plugin files cannot create a matrix leg.
          names=$(for manifest in plugins/*/plugin.toml; do
            if [[ -f "$manifest" ]]; then basename "$(dirname "$manifest")"; fi
          done | jq -R . | jq -sc .)
          echo "providers=$names" >> "$GITHUB_OUTPUT"

  provider:
    name: 🧩 ${{ matrix.provider }}
    needs: providers-list
    # A matrix with no entries is an error, not an empty run.
    if: needs.providers-list.outputs.providers != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.providers-list.outputs.providers) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Build and package this provider
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          python3 "plugins/$PROVIDER/scripts/package.py"
          python3 -m unittest discover -s "plugins/$PROVIDER/tests"
          git diff --exit-code -- "plugins/$PROVIDER/plugin.toml" || {
            echo "::error::packaging must not change plugin.toml"
            exit 1
          }
          git diff --exit-code -- "plugins/$PROVIDER/manifest.toml" || {
            echo "::error::commit the regenerated manifest.toml before publishing"
            exit 1
          }
          (cd "plugins/$PROVIDER/dist" && for checksum in *.sha256sum; do sha256sum --check "$checksum"; done)
          for manifest in plugins/"$PROVIDER"/modules/*/memcastle-source.toml; do
            if [[ -f "$manifest" ]]; then
              lock="$(dirname "$manifest")/Cargo.lock"
              git ls-files --error-unmatch "$lock" >/dev/null || {
                echo "::error::commit $lock after packaging so release dependencies stay pinned"
                exit 1
              }
            fi
          done
      - name: Preserve compiled components when artifact digests disagree
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: provider-components-${{ matrix.provider }}
          path: plugins/${{ matrix.provider }}/modules/*/source.wasm
      - name: Conformance-test provider sources against released Core
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER: ${{ matrix.provider }}
        run: |
          core_tag="$(gh release list --repo memcastle/memcastle --limit 1000 --json tagName,isDraft,isPrerelease | python3 packaging/plugins/latest_core_release.py)"
          gh release download "$core_tag" --repo memcastle/memcastle --pattern 'memcastle_*_linux-amd64' --dir "$RUNNER_TEMP"
          binary=("$RUNNER_TEMP"/memcastle_*_linux-amd64)
          chmod +x "${binary[0]}"
          for manifest in plugins/"$PROVIDER"/modules/*/memcastle-source.toml; do
            if [[ -f "$manifest" ]]; then
              "${binary[0]}" source test "$(dirname "$manifest")" --no-build
            fi
          done
