name: 🧩 Provider plugins

on:
  pull_request:
    paths:
      - plugins/**
      - wit/**
      - src/plugin/**
      - src/domain/plugin*.rs
      - src/app/plugins.rs
      - src/api/plugins.rs
      - src/store/plugins.rs
      - database/schema/plugin*.surql
      - src/config/mod.rs
      - src/distribution/plugin.rs
      - src/mining/**
      - src/source/**
      - src/domain/source_package.rs
      - src/app/source_packages.rs
      - database/schema/source_package.surql
      - src/integration/**
      - packaging/plugins/**
      - tests/wasm_plugin.rs
      - .github/workflows/plugins.yaml
  push:
    branches: [main]
    paths:
      - plugins/**
      - wit/**
      - src/plugin/**
      - src/domain/plugin*.rs
      - src/app/plugins.rs
      - src/api/plugins.rs
      - src/store/plugins.rs
      - database/schema/plugin*.surql
      - src/config/mod.rs
      - src/distribution/plugin.rs
      - src/mining/**
      - src/source/**
      - src/domain/source_package.rs
      - src/app/source_packages.rs
      - database/schema/source_package.surql
      - src/integration/**
      - packaging/plugins/**
      - tests/wasm_plugin.rs
      - .github/workflows/plugins.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.select.outputs.providers }}
      contract: ${{ steps.select.outputs.contract }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Core release selection and changed-provider logic
        run: python3 -m unittest discover -s packaging/plugins
      - name: Select affected providers
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 packaging/plugins/changed.py

  provider:
    name: 🧩 ${{ matrix.provider }}
    needs: changed
    if: needs.changed.outputs.providers != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.changed.outputs.providers) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Build and package only the selected provider
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          python3 "plugins/$PROVIDER/scripts/package.py"
          python3 -m unittest discover -s "plugins/$PROVIDER/tests"
          git diff --exit-code -- "plugins/$PROVIDER/plugin.toml" || {
            echo "::error::commit the plugin.toml artifact digests produced by packaging"
            exit 1
          }
          for manifest in plugins/"$PROVIDER"/modules/*/memcastle-source.toml; do
            if [[ -f "$manifest" ]]; then
              lock="$(dirname "$manifest")/Cargo.lock"
              git ls-files --error-unmatch "$lock" >/dev/null || {
                echo "::error::commit $lock after packaging so release dependencies stay pinned"
                exit 1
              }
            fi
          done
      - name: Preserve compiled components when artifact digests disagree
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: provider-components-${{ matrix.provider }}
          path: plugins/${{ matrix.provider }}/modules/*/source.wasm
      - name: Conformance-test provider sources against released Core
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER: ${{ matrix.provider }}
        run: |
          core_tag="$(gh release list --repo memcastle/memcastle --limit 1000 --json tagName,isDraft,isPrerelease | python3 packaging/plugins/latest_core_release.py)"
          gh release download "$core_tag" --repo memcastle/memcastle --pattern 'memcastle_*_linux-amd64' --dir "$RUNNER_TEMP"
          binary=("$RUNNER_TEMP"/memcastle_*_linux-amd64)
          chmod +x "${binary[0]}"
          for manifest in plugins/"$PROVIDER"/modules/*/memcastle-source.toml; do
            if [[ -f "$manifest" ]]; then
              "${binary[0]}" source test "$(dirname "$manifest")" --no-build
            fi
          done

  generated-contract:
    name: 🧩 Generated plugin against current Core
    needs: changed
    if: needs.changed.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Build the current Core contract
        run: cargo build --locked --bin memcastle
      - uses: actions/checkout@v7
        with:
          repository: memcastle/memcastle-plugin.tpl
          path: templates/memcastle-plugin.tpl
      - uses: actions/checkout@v7
        with:
          repository: memcastle/memcastle-source.tpl
          ref: 5f2a8350bd82c49ec2370d70c83019ff6fc5a822
          path: templates/memcastle-source.tpl
      - uses: actions/checkout@v7
        with:
          repository: memcastle/memcastle-integration.tpl
          ref: 04cc8455f056485cb08298a4a0af82909d314fe9
          path: templates/memcastle-integration.tpl
      - name: Install GitTPL 0.14 for native composition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.14.0 --repo noirbizarre/git-tpl --pattern 'git-tpl_0.14.0_linux-amd64.tar.gz' --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/git-tpl_0.14.0_linux-amd64.tar.gz" -C "$RUNNER_TEMP" ./git-tpl
      - name: Build and install a generated multi-module plugin against this Core
        working-directory: templates/memcastle-plugin.tpl
        env:
          GIT_TPL_BIN: ${{ runner.temp }}/git-tpl
          MEMCASTLE_BIN: ${{ github.workspace }}/target/debug/memcastle
        run: python3 scripts/check_composition.py --build
