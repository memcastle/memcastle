name: Windows coverage probe

on:
  push:
    branches: [diagnostics/pr389-windows-coverage]

permissions:
  contents: read

jobs:
  probe:
    name: MemCastle Windows coverage
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link
      CARGO_INCREMENTAL: "0"
      LLVM_PROFILE_FILE_NAME: '%m-%b.profraw'
      LLVM_PROFILE_VERBOSE: "1"
      RUSTFLAGS: -C link-arg=/build-id
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: jdx/mise-action@v5
        with:
          cache: true
      - uses: ./.github/actions/setup-windows
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: tests-windows-v1
      - name: Build and run representative tests with visible runtime output
        shell: bash
        run: |
          rustc -vV
          command -v cargo
          command -v lld-link
          lld-link --version
          cargo llvm-cov show-env
          cargo llvm-cov clean --workspace
          targets=(--lib --bin memcastle --test in_process)
          for file in tests/*.rs; do
            name="${file#tests/}"
            name="${name%.rs}"
            case "$name" in
              wasm_*|persistence|mcp_smoke|auth_lifecycle) ;;
              *) targets+=(--test "$name") ;;
            esac
          done
          # Compile the same targets, but expose output from both a standalone and a full application test.
          cargo llvm-cov nextest --profile ci --no-report "${targets[@]}" \
            -E 'binary(source_isolation) or test(server::health_endpoint_reports_ok)' --success-output immediate
      - name: Inspect profiles and executables before the full test run
        if: always()
        shell: pwsh
        run: |
          $profiles = @(Get-ChildItem target -Recurse -Filter '*.profraw' -ErrorAction Continue)
          Write-Output "RAW_PROFILE_COUNT=$($profiles.Count)"
          $profiles | Select-Object FullName, Length
          $binaries = Get-ChildItem target/llvm-cov-target/debug/deps -Filter '*.exe' |
            Where-Object { $_.Name -match '^(source_isolation|in_process)-' }
          foreach ($binary in $binaries) {
            Write-Output "BINARY=$($binary.FullName)"
            llvm-readobj --sections $binary.FullName | Select-String '\.lprf|\.lcov'
          }
      - name: Run the complete basic suite
        shell: bash
        run: |
          targets=(--lib --bin memcastle --test in_process)
          for file in tests/*.rs; do
            name="${file#tests/}"
            name="${name%.rs}"
            case "$name" in
              wasm_*|persistence|mcp_smoke|auth_lifecycle) ;;
              *) targets+=(--test "$name") ;;
            esac
          done
          cargo llvm-cov nextest --profile ci --no-report "${targets[@]}"
      - name: Locate profiles after the full suite
        if: always()
        shell: pwsh
        run: |
          $profiles = @(Get-ChildItem target -Recurse -Filter '*.profraw' -ErrorAction Continue)
          Write-Output "RAW_PROFILE_COUNT=$($profiles.Count)"
          $profiles | Select-Object FullName, Length
          Get-ChildItem target/llvm-cov-target -Force
      - name: Generate coverage report
        shell: bash
        run: cargo llvm-cov report --lcov --output-path lcov.info
