name: Windows coverage probe

on:
  push:
    branches: [diagnostics/pr389-windows-coverage]

permissions:
  contents: read

jobs:
  probe:
    name: Coverage (${{ matrix.mode }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [native, mbx]
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link
      CARGO_INCREMENTAL: "0"
      MBX_TARGET_VIEWS: "0"
      MBX_CACHE_LINKS: "0"
      MBX_DISABLE: ${{ matrix.mode == 'native' && '1' || '0' }}
      LLVM_PROFILE_FILE_NAME: '%m-%b.profraw'
      LLVM_PROFILE_VERBOSE: "1"
      RUSTFLAGS: -C link-arg=/build-id
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: jdx/mise-action@v5
        with:
          cache: true
      # Match the failing run's target junction and native temporary paths.
      - uses: ./.github/actions/setup-windows
      - name: Create dependency-free probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .coverage-probe/src -Force
          @'
          [package]
          name = "coverage_probe"
          version = "0.0.0"
          edition = "2024"

          [workspace]

          [profile.dev]
          debug = "line-tables-only"
          '@ | Set-Content .coverage-probe/Cargo.toml
          @'
          #[test]
          fn print_profile_destination() {
              eprintln!("LLVM_PROFILE_FILE={:?}", std::env::var_os("LLVM_PROFILE_FILE"));
              eprintln!("cwd={:?}", std::env::current_dir());
          }
          '@ | Set-Content .coverage-probe/src/lib.rs
          # Exercise the same ReFS junction as MemCastle rather than the system drive.
          New-Item -ItemType Junction -Path .coverage-probe/target -Target "$env:GITHUB_WORKSPACE/target"
      - name: Run coverage
        shell: bash
        working-directory: .coverage-probe
        run: |
          rustc -vV
          command -v cargo
          command -v lld-link
          lld-link --version
          cargo llvm-cov show-env
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --no-report --success-output immediate
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Locate raw profiles
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path .coverage-probe, target, $env:TEMP -Recurse -Filter '*.profraw' -ErrorAction Continue |
            Select-Object FullName, Length
