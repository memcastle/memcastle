name: Windows coverage probe

on:
  push:
    branches: [diagnostics/pr389-windows-coverage]

permissions:
  contents: read

jobs:
  probe:
    name: Root coverage (${{ matrix.invocation }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        invocation: [wrapped, direct]
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link
      CARGO_INCREMENTAL: "0"
      LLVM_PROFILE_FILE_NAME: '%m-%b.profraw'
      LLVM_PROFILE_VERBOSE: "1"
      RUSTFLAGS: -C link-arg=/build-id
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: jdx/mise-action@v5
        with:
          cache: true
      - uses: ./.github/actions/setup-windows
      - name: Replace the manifest only in this disposable runner
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .coverage-probe -Force
          @'
          [package]
          name = "memcastle"
          version = "0.0.0"
          edition = "2024"
          autobins = false
          autotests = false
          autoexamples = false
          autobenches = false

          [lib]
          path = ".coverage-probe/lib.rs"

          [workspace]

          [profile.dev]
          debug = "line-tables-only"
          '@ | Set-Content Cargo.toml
          @'
          #[test]
          fn print_profile_destination() {
              eprintln!("LLVM_PROFILE_FILE={:?}", std::env::var_os("LLVM_PROFILE_FILE"));
              eprintln!("cwd={:?}", std::env::current_dir());
          }
          '@ | Set-Content .coverage-probe/lib.rs
          # Project filters name binaries removed by the dependency-free manifest.
          '[profile.default]' | Set-Content .config/nextest.toml
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: probe-pr389-root
      - name: Compare Cargo entry points
        shell: bash
        env:
          INVOCATION: ${{ matrix.invocation }}
        run: |
          if [[ "$INVOCATION" == wrapped ]]; then
            command=(cargo llvm-cov)
          else
            command=(cargo-llvm-cov llvm-cov)
          fi
          "${command[@]}" show-env
          "${command[@]}" clean --workspace
          "${command[@]}" nextest --no-report --success-output immediate
          "${command[@]}" report --lcov --output-path lcov.info
      - name: Inspect generated files and the Cargo wrapper
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem target -Recurse -Filter '*.profraw' | Select-Object FullName, Length
          Get-ChildItem target -Directory
          $wrapper = Join-Path $env:LOCALAPPDATA 'mise/command-wrappers/bin/cargo'
          if (Test-Path $wrapper) { Get-Content $wrapper }
