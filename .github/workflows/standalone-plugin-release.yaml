name: Release standalone plugin

on:
  workflow_call:
    inputs:
      package-command:
        type: string
        required: false
        default: python3 scripts/package.py
      check-command:
        type: string
        required: false
        default: python3 scripts/check_modules.py
      smoke-command:
        type: string
        required: false
        default: python3 scripts/smoke_install.py
      extra-smoke-command:
        type: string
        required: false
        default: ""
      bun-version:
        type: string
        required: false
        default: "1.4.2"
      fixture-bin:
        type: string
        required: false
        default: ""
      core-versions:
        type: string
        required: false
        default: "[]"

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/plugin-validation.yaml
    with:
      package-command: ${{ inputs.package-command }}
      check-command: ${{ inputs.check-command }}
      smoke-command: ${{ inputs.smoke-command }}
      extra-smoke-command: ${{ inputs.extra-smoke-command }}
      bun-version: ${{ inputs.bun-version }}
      fixture-bin: ${{ inputs.fixture-bin }}
      core-versions: ${{ inputs.core-versions }}

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a reviewed version tag on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          expected="$(python3 -c 'import tomllib; p=tomllib.load(open("plugin.toml", "rb"))["plugin"]; print("{}/v{}".format(p["id"], p["version"]))')"
          [[ "$TAG" == "$expected" ]] || { echo '::error::tag does not match plugin.toml'; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo '::error::tag must be on main'; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo '::error::release already exists; bump plugin.version before publishing'
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: plugin-package
      - name: Publish validated archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ needs.validate.outputs.archive }}
        run: |
          set -euo pipefail
          test -s "dist/$ARCHIVE"
          gh release create "$TAG" "dist/$ARCHIVE" --generate-notes
