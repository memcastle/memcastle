name: Validate built standalone plugin

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Actions artifact containing the built plugin archive and source components
        type: string
        required: true
      archive-path:
        description: Path to the single already-built archive, relative to the artifact root
        type: string
        required: false
        default: ""
      plugin-ref:
        description: Plugin tag/ref whose checked-out fixtures match the uploaded archive
        type: string
        required: false
        default: ""
      core-version:
        description: Caller-selected development release, stable release tree, or exact version
        type: string
        required: true
      smoke-command:
        description: Optional provider-owned installation check after the generic archive smoke test
        type: string
        required: false
        default: ""
      extra-smoke-command:
        description: Optional provider-owned migration check
        type: string
        required: false
        default: ""
      fixture-bin:
        description: Optional fixture commands to prepend to PATH for source conformance
        type: string
        required: false
        default: ""
    outputs:
      archive:
        description: The sole validated archive path relative to the repository root
        value: ${{ jobs.compatibility.outputs.archive }}

permissions:
  contents: read

jobs:
  compatibility:
    name: Core ${{ inputs.core-version }}
    runs-on: ubuntu-latest
    outputs:
      archive: ${{ steps.archive.outputs.path }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.plugin-ref || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
      - name: Require the provider's built archive
        id: archive
        env:
          ARCHIVE: ${{ inputs.archive-path }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ARCHIVE" ]]; then
            shopt -s nullglob
            archives=(dist/*.tar.gz)
            [[ "${#archives[@]}" -eq 1 ]] || { echo '::error::expected exactly one built plugin archive below dist/'; exit 1; }
            ARCHIVE="${archives[0]}"
          fi
          [[ "$ARCHIVE" == dist/* && "$ARCHIVE" != *..* && "$ARCHIVE" == *.tar.gz ]] || {
            echo '::error::archive-path must name one archive below dist/'
            exit 1
          }
          test -s "$ARCHIVE" || { echo "::error::built archive missing: $ARCHIVE"; exit 1; }
          echo "path=$ARCHIVE" >> "$GITHUB_OUTPUT"
      - uses: memcastle/memcastle@main
        id: core
        with:
          version: ${{ inputs.core-version }}
      - name: Check source conformance and isolated plugin installation
        env:
          ARCHIVE: ${{ steps.archive.outputs.path }}
          FIXTURE_BIN: ${{ inputs.fixture-bin }}
          SMOKE: ${{ inputs.smoke-command }}
          EXTRA_SMOKE: ${{ inputs.extra-smoke-command }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$FIXTURE_BIN" ]]; then
            export PATH="$PWD/$FIXTURE_BIN:$PATH"
          fi
          for manifest in modules/*/memcastle-source.toml sources/*/memcastle-source.toml; do
            if [[ -f "$manifest" ]]; then
              module_dir="$(dirname "$manifest")"
              if [[ -f "$module_dir/source.wasm" ]]; then
                mkdir -p "$module_dir/dist"
                cp "$module_dir/source.wasm" "$module_dir/dist/source.wasm"
              fi
              memcastle source test "$module_dir" --no-build
            fi
          done
          memcastle plugin test "$ARCHIVE"
          if [[ -n "$SMOKE" ]]; then
            bash -e -o pipefail -c "$SMOKE"
          fi
          if [[ -n "$EXTRA_SMOKE" ]]; then
            bash -e -o pipefail -c "$EXTRA_SMOKE"
          fi
          archive_digest="$(sha256sum "$ARCHIVE")"
          archive_digest="${archive_digest%% *}"
          echo "Provider $(git rev-parse HEAD), archive $ARCHIVE (SHA-256 $archive_digest), Core ${{ steps.core.outputs.resolved_version }} (${{ steps.core.outputs.core_sha }}) passed conformance and isolated lifecycle validation" >> "$GITHUB_STEP_SUMMARY"
