name: Validate standalone plugin

on:
  workflow_call:
    inputs:
      package-command:
        type: string
        required: false
        default: python3 scripts/package.py
      check-command:
        type: string
        required: false
        default: python3 scripts/check_modules.py
      smoke-command:
        type: string
        required: false
        default: python3 scripts/smoke_install.py
      extra-smoke-command:
        type: string
        required: false
        default: ""
      bun-version:
        type: string
        required: false
        default: "1.4.2"
      fixture-bin:
        type: string
        required: false
        default: ""
      core-versions:
        description: JSON array of additional exact, plugin-capable Core release tags
        type: string
        required: false
        default: "[]"
    outputs:
      archive:
        description: Validated release archive name under dist/
        value: ${{ jobs.package.outputs.archive }}

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      cores: ${{ steps.list.outputs.cores }}
    steps:
      - id: list
        env:
          VERSIONS: ${{ inputs.core-versions }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          versions = json.loads(os.environ['VERSIONS'])
          if not isinstance(versions, list) or any(not isinstance(v, str) or not re.fullmatch(r'\d+\.\d+\.\d+', v) for v in versions):
              raise ValueError('core-versions must be a JSON array of exact stable tags')
          if len(set(versions)) != len(versions):
              raise ValueError('core-versions must not contain duplicates')
          print('cores=' + json.dumps(['main', *versions]))
          PY
  package:
    runs-on: ubuntu-latest
    outputs:
      archive: ${{ steps.metadata.outputs.archive }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}
      - uses: memcastle/memcastle/.github/actions/core-binary@main
        id: core
        with:
          version: main
      - name: Package this provider
        env:
          COMMAND: ${{ inputs.package-command }}
        run: bash -e -o pipefail -c "$COMMAND"
      - name: Check this provider's modules
        env:
          COMMAND: ${{ inputs.check-command }}
        run: bash -e -o pipefail -c "$COMMAND"
      - name: Check reviewed hashes and source dependency locks
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- plugin.toml || { echo '::error::commit reviewed plugin.toml artifact digests'; exit 1; }
          for manifest in modules/*/memcastle-source.toml; do
            if [[ -f "$manifest" ]]; then
              lock="$(dirname "$manifest")/Cargo.lock"
              git ls-files --error-unmatch "$lock" >/dev/null || { echo "::error::commit $lock"; exit 1; }
            fi
          done
      - name: Check plugin metadata
        run: python3 -m unittest discover -s tests
      - name: Identify validated archive
        id: metadata
        shell: bash
        run: |
          archive="$(python3 -c 'import tomllib; p=tomllib.load(open("plugin.toml", "rb"))["plugin"]; print("{}-{}.tar.gz".format(p["id"], p["version"]))')"
          test -s "dist/$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-package
          path: |
            dist/*.tar.gz
            modules/*/source.wasm
            modules/*/dist/**
          if-no-files-found: error

  compatibility:
    needs: [matrix, package]
    name: Core ${{ matrix.core }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ${{ fromJSON(needs.matrix.outputs.cores) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: plugin-package
      - uses: memcastle/memcastle/.github/actions/core-binary@main
        id: core
        with:
          version: ${{ matrix.core }}
      - name: Run provider conformance and integration tests
        env:
          MEMCASTLE_BIN: ${{ steps.core.outputs.binary }}
          FIXTURE_BIN: ${{ inputs.fixture-bin }}
          SMOKE: ${{ inputs.smoke-command }}
          EXTRA_SMOKE: ${{ inputs.extra-smoke-command }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$FIXTURE_BIN" ]]; then
            export PATH="$PWD/$FIXTURE_BIN:$PATH"
          fi
          for manifest in modules/*/memcastle-source.toml; do
            if [[ -f "$manifest" ]]; then
              "$MEMCASTLE_BIN" source test "$(dirname "$manifest")" --no-build
            fi
          done
          bash -e -o pipefail -c "$SMOKE"
          if [[ -n "$EXTRA_SMOKE" ]]; then
            bash -e -o pipefail -c "$EXTRA_SMOKE"
          fi
          echo 'Core ${{ matrix.core }} (${{ steps.core.outputs.core_sha }}) passed conformance and installation' >> "$GITHUB_STEP_SUMMARY"
