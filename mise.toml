# Toolchain and task definitions.
#
# Tool versions are resolved to exact builds in `mise.lock`, which is committed.
# CI installs from these two files, so local runs and CI runs use identical tool versions.
#
# Tools no CI job needs are declared on their own task rather than in `[tools]`,
# because `mise install` — what CI runs — installs `[tools]` only.
# It matters as cargo-binstall has no prebuilt artifact for some cargo tools,
# so a global entry would make every CI job compile them from source.
[settings]
# Resolve tools through mise.lock and keep it updated.
lockfile = true

# The explicit Rust entry supplies native wrapping. Avoid a second request
# from the version file; runtime selection below preserves CI's toolchain.
idiomatic_version_file_enable_tools = []

[tools]
# Keep the install request stable and lockable; runtime selection lives in env.
# Explicit runtime selection bypasses rust-toolchain.toml's automatic target provisioning.
rust = { version = "stable", components = ["rustfmt", "clippy"], targets = ["wasm32-wasip3"], mr_boxington = true }
mr-boxington = "latest"
actionlint = "latest"
# actionlint silently skips its shellcheck integration when the binary is absent
# Preserve the backend recorded in mise.lock so locked installs and executable lookup agree.
"aqua:koalaman/shellcheck" = "latest"
prek = "latest"
typos = "latest"
git-cliff = "latest"
cargo-binstall = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:git-tpl" = "latest"
# Zensical runs through `uvx`, so uv is the only thing the docs build needs.
uv = "latest"

# --- begin project-specific tools ---
# Add project-wide tools here; tools needed by only one task belong on that task.
# The project-owned architecture hook runs in CI's lint job, so `mise install`
# must install the same pinned ast-grep binary on developer machines and CI.
"aqua:ast-grep/ast-grep" = "latest"
bun = "latest"
"cargo:wasm-tools" = "1.263.0"
# --- end project-specific tools ---

[env]
# Use local assets and the dashboard during development; daemon/installer suites unset MEMCASTLE_* first.
MEMCASTLE_ASSETS_DIR = "{{ config_root }}"
MEMCASTLE_WEB_ENABLE = true
# dtolnay selects a rustup default, not RUSTUP_TOOLCHAIN. Explicit selections
# win; otherwise retain that default in Actions and the project's channel locally.
RUSTUP_TOOLCHAIN = """
{%- if env.RUSTUP_TOOLCHAIN | default(value='', boolean=true) -%}
{{ env.RUSTUP_TOOLCHAIN }}
{%- elif env.GITHUB_ACTIONS | default(value='') == 'true' -%}
{{ exec(command='rustup default') | trim | split(pat=' ') | first }}
{%- else -%}
stable
{%- endif -%}
"""
# Keep existing target outputs in place; automatic cache collection follows
# the developer's global mbx policy (or mbx's bounded defaults).
MBX_TARGET_VIEWS = "0"

[hooks]
postinstall = [
  "prek install",
  "bun install --cwd web --frozen-lockfile",
]

# --- Everyday ---------------------------------------------------------------
[tasks.default]
description = "Run format, lint, build and test"
depends = ["format", "lint", "lint:actions", "lint:md", "build", "test"]

[tasks.build]
description = "Build the project"
run = "cargo build"
sources = [
  "Cargo.toml",
  "Cargo.lock",
  "rust-toolchain.toml",
  "mise.lock",
  ".cargo/config",
  ".cargo/config.toml",
  "build.rs",
  "src/**",
  # These files are embedded at compile time; omitting them can leave a stale binary marked fresh.
  "database/schema/**",
  "wit/**",
]
outputs = [
  'target/debug/memcastle{% if os() == "windows" %}.exe{% endif %}',
  "target/debug/libmemcastle.rlib",
]

[tasks.test]
description = "Run the basic tests, without the WebAssembly suite (accepts nextest selectors)"
raw_args = true
run = "cargo nextest run"

[tasks.cover]
description = "Run tests with coverage"
run = "cargo llvm-cov nextest"

[tasks.format]
description = "Format the code"
run = "cargo fmt --all"

[tasks."format:check"]
description = "Check the formatting without rewriting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Lint the code"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.spell]
description = "Check spelling"
run = "typos"

[tasks."lint:actions"]
description = "Lint the GitHub Actions workflows"
# Suppressions live in .github/actionlint.yml rather than as flags here,
# so this task and the prek hook cannot drift apart.
run = "actionlint .github/workflows/*.yaml"

[tasks."lint:md"]
description = "Lint all project Markdown"
# Install the native binary only for this task; keep its version aligned with
# the rumdl pre-commit hook in prek.toml.
tools = { rumdl = "0.3.2" }
# The shared rumdl config excludes the generated root CHANGELOG.md.
run = "rumdl check ."

[tasks.snapshots]
description = "Review and update insta snapshots interactively"
# cargo-insta is declared here as only used once by this task
tools = { "cargo:cargo-insta" = "latest" }
run = "cargo insta review"

[tasks.check]
description = "Run every check that does not modify the working tree"
# `guards`, `test:wasm`, `sources:check` and `web:check` are project-specific: without them
# `check`/`ci` pass locally while the architecture hooks (which otherwise run only on commit and in CI), the
# WebAssembly suite, the reference sources and the dashboard fail later.
depends = ["format:check", "lint", "lint:actions", "lint:md", "spell", "guards", "test", "test:wasm", "sources:check", "web:check"]

[tasks.ci]
description = "The local equivalent of CI's lint, test and documentation steps"
depends = ["check", "docs:build"]

# --- memcastle itself ---------------------------------------------------

[tasks.cli]
description = "Run memcastle from source"
raw_args = true
run = "cargo run --bin memcastle --"

[tasks.setup]
description = "Install memcastle locally, into ~/.cargo/bin"
run = "cargo install --path . --force"

# --- Documentation ----------------------------------------------------------

[tasks."docs:generate"]
description = "Validate the plugin catalogue and generate its documentation page"
# uv supplies Python on machines that have only the docs toolchain installed.
run = "uv run --no-project --python 3 python -B packaging/docs/generate_plugin_catalogue.py"

[tasks.docs]
description = "Serve the documentation locally"
depends = ["docs:generate"]
run = "uvx zensical serve"

[tasks."docs:build"]
description = "Build the documentation"
depends = ["docs:generate"]
run = "uvx zensical build"

# --- Release ----------------------------------------------------------------

[tasks.changelog]
description = "Preview the changelog for the unreleased commits"
run = "git cliff --unreleased"

[tasks.release]
description = "Show the version the next release would take"
# The release itself is driven by gh-ship from .github/workflows/ship.yaml.
# This task exists to answer 'what would ship next?' without opening CI.
run = "git cliff --bumped-version"

[tasks."ship:validate"]
description = "Check the release setup against what gh-ship requires"
run = "gh ship validate"

# --- Template ---------------------------------------------------------------
#
# This project is rendered from https://github.com/noirbizarre/rust.tpl
# To update it:
#
#   mise tpl:check       # has it moved?
#   mise tpl:update      # bring the rendered ref up to date
#   mise tpl:diff        # read what merging it would change
#   mise tpl:merge       # take it

[tasks."tpl:update"]
description = "Advance refs/tpl/<id>; may save migrated answers without merging rendered files"
raw_args = true
run = "git tpl update"

[tasks."tpl:diff"]
description = "Show what merging the template would change"
raw_args = true
run = "git tpl diff"

[tasks."tpl:merge"]
description = "Merge the last updated rendered files"
raw_args = true
run = "git tpl merge"

[tasks."tpl:check"]
description = "Has the template moved? Exits 1 if merging it would change anything"
run = [
  "git tpl update",
  "git tpl diff --exit-code --stat",
]

# --- project-specific tasks --------------------------------------------------
#
# Add your own tasks below this line and global tools between the tools markers.
# Group related project tasks here; the template owns the sections above.
# Git's 3-way merge preserves project additions across template merges.
#
# Open any multi-line `run` block with `#!/usr/bin/env bash`. Without one mise
# runs it through `sh`, which is dash on a GitHub runner — `set -o pipefail`
# errors there and `< <(...)` is a syntax error — while `/bin/sh` is often bash
# locally. The difference does not show up until CI.
#
# Artwork tasks belong here rather than in `default` or `check`: they rewrite
# committed binaries, so a routine run would dirty the working tree every time.

[tasks.guards]
description = "Run the architecture guard and rule tests over the whole tree"
run = """
prek run --all-files architecture
prek run --all-files architecture-rule-tests
"""

[tasks."docs:test"]
description = "Test plugin catalogue validation and documentation generation"
run = "uv run --no-project --python 3 python -B -m unittest discover -s packaging/docs -p 'test_*.py'"

[tasks."test:wasm"]
description = "Run the WebAssembly suite: every tests/wasm_*.rs binary (slow, needs the wasm32-wasip3 target)"
# `raw_args` so nextest selectors reach it, like `test`. The `wasm` profile selects the `wasm_` binaries
# (.config/nextest.toml); `test` excludes them, which is what keeps the everyday loop fast.
# `--test 'wasm_*'` is the same prefix as a Cargo glob, and it keeps Cargo from compiling and linking the other thirty
# test binaries (about 600 MB each) just for nextest to skip them.
raw_args = true
run = "uv run --no-project --python 3 python -B packaging/tests/run.py cargo nextest run --profile wasm --test 'wasm_*'"

[tasks."components:check"]
description = "Compile and validate every reference/example/test component as WASI 0.3.0"
run = "uv run --no-project --python 3 python -B packaging/plugins/validate_components.py"

[tasks."test:fast"]
description = "Run basic tests without compiling WebAssembly or Linux-only slow test binaries"
# nextest's profile filters execution only; enumerating Cargo targets avoids linking skipped WASM binaries.
run = """
#!/usr/bin/env bash
set -euo pipefail
targets=(--lib --bin memcastle --test in_process)
for file in tests/*.rs; do
  name="${file#tests/}"
  name="${name%.rs}"
  case "$name" in
    wasm_*|persistence|mcp_smoke|auth_lifecycle) ;;
    *) targets+=(--test "$name") ;;
  esac
done
uv run --no-project --python 3 python -B packaging/tests/run.py cargo nextest run "${targets[@]}"
"""

[tasks."test:slow"]
description = "Run the process-boundary and retrieval-baseline tests (Linux CI gate)"
run = "uv run --no-project --python 3 python -B packaging/tests/run.py cargo nextest run --profile slow --features slow-tests --test persistence --test mcp_smoke --test auth_lifecycle --test in_process"

[tasks."test:prepared"]
description = "Run selected existing tests with run-scoped prepared database fixtures"
raw_args = true
run = "uv run --no-project --python 3 python -B packaging/tests/run.py cargo nextest run"

[tasks."check:all"]
description = "Run the local checks and the additional Linux-only slow suite"
# The template owns `check` above the project-specific marker; compose it rather than editing template content.
depends = ["check", "test:slow"]

[tasks."web:check"]
description = "Build and test the web UI, including checkout and installed-prefix serving"
# Cargo's integration-test build also produces the daemon; a separate build would compile a second feature graph.
depends = ["web:build"]
run = """
#!/usr/bin/env bash
set -euo pipefail
# Development overrides must not make the installed-prefix test read assets from the checkout.
for name in "${!MEMCASTLE_@}"; do unset "$name"; done
# The bundle tests consume the same build as the frontend's real-daemon tests, without rebuilding it.
cargo test --test web_bundle -- --ignored
cd web
bun run test ${COVERAGE:+--coverage}
# Against a real daemon, serving the build made above.
bun run test:daemon
"""

[tasks."web:build"]
description = "Build the web UI into web/dist, which is all development mode needs"
# After this, `memcastle serve --assets-dir "$PWD"` with `web.enable` serves the dashboard as built in this checkout.
sources = [
  "package.json",
  "bun.lock",
  "bunfig.toml",
  "vite.config.ts",
  "dev/**", # The Vite configuration imports the development daemon plugin.
  "tsconfig.json",
  "env.d.ts",
  "index.html",
  "src/**",
  "public/**",
  "../docs/images/icon.svg", # Vite's @brand alias imports this file from outside web/.
]
outputs = ["dist/index.html", "dist/assets"]
run = "bun run build"
dir = "web"

[tasks."web:dev"]
description = "Run the dashboard's dev server (hot reload) against the running daemon"
# The page is the dev server's and `/api` is proxied to the daemon, found through its registry file or MEMCASTLE_URL.
run = "bun run dev"
dir = "web"

[tasks."sources:check"]
description = "Build and conformance-test every reference WebAssembly source under sources/"
# `memcastle source build` is what a source author runs, so this is also the proof that it works on the reference
# sources. It needs the `wasm32-wasip3` target, which rust-toolchain.toml requests.
run = """
#!/usr/bin/env bash
set -euo pipefail
for manifest in sources/*/memcastle-source.toml; do
  source="$(dirname "$manifest")"
  echo "==> $source"
  mise run sources:test -- "${source#sources/}"
done
"""

[tasks."sources:test"]
description = "Build and conformance-test one reference WebAssembly source: mise run sources:test -- <name>"
# What CI runs for each directory under sources/, one job per source.
usage = 'arg "<name>" help="A directory name under sources/"'
depends = ["build"]
run = """
#!/usr/bin/env bash
set -euo pipefail
# The stand-in for a wrapped program, when the source ships one (see `sources:check`).
PATH="$PWD/sources/${usage_name?}/fixtures/bin:$PATH" ./target/debug/memcastle source test "sources/${usage_name?}"
"""

[tasks.docker]
description = "Build the container image for local testing"
depends = ["build", "web:build"]
run = "docker build --tag memcastle:local ."

# The retrieval evaluation (docs/retrieval-evaluation.md). Explicit report-writing tasks stay outside `check` and `ci`;
# the committed baseline runs separately in Linux's slow test suite (`mise run test:slow`).
# They run the `#[ignore]`d tests of `tests/in_process/retrieval_eval`, with `--no-capture` so the report reaches the
# terminal, and with the `[env]` development defaults dropped so they cannot change the test configuration.

[tasks.eval]
description = "Measure retrieval quality and latency on the bundled dataset: prints a report, writes target/eval/report.json"
# EVAL_REPETITIONS (timed passes, default 5), EVAL_SCALE (filler documents, default 0), EVAL_OUT (report path) and
# EVAL_DATASET (another dataset file) tune a run; the page lists them.
run = """
#!/usr/bin/env bash
set -euo pipefail
for name in "${!MEMCASTLE_@}"; do unset "$name"; done
cargo nextest run --test in_process --no-capture --run-ignored ignored-only -E 'test(retrieval_eval::explicit::an_explicit_run)'
"""

[tasks."eval:baseline"]
description = "Re-measure the bundled dataset and rewrite the committed baseline (tests/fixtures/retrieval/baseline.json)"
# Only for a change that is meant to move retrieval quality, and then reviewed like any other diff: the baseline is the
# floor the Linux slow suite holds the engine to.
run = """
#!/usr/bin/env bash
set -euo pipefail
for name in "${!MEMCASTLE_@}"; do unset "$name"; done
# Timings are not part of a baseline, so there is nothing to repeat.
EVAL_UPDATE_BASELINE=1 EVAL_REPETITIONS=0 \\
  cargo nextest run --test in_process --no-capture --run-ignored ignored-only -E 'test(retrieval_eval::explicit::an_explicit_run)'
"""

[tasks."eval:compare"]
description = "Compare two reports and fail on a drop: mise run eval:compare -- <base.json> <new.json> [threshold]"
usage = '''
arg "<base>" help="The report to compare against, such as tests/fixtures/retrieval/baseline.json"
arg "<new>" help="The report to judge, such as target/eval/report.json"
arg "[threshold]" help="The largest drop in any metric that is tolerated" default="0.02"
'''
env = { EVAL_FAIL_ON_REGRESSION = "1" }
run = '''EVAL_BASE="${usage_base?}" EVAL_NEW="${usage_new?}" EVAL_THRESHOLD="${usage_threshold:-0.02}" cargo nextest run --test in_process --no-capture --run-ignored ignored-only -E 'test(retrieval_eval::explicit::an_explicit_compare)' '''

[tasks."eval:longmemeval"]
description = "Measure session retrieval on a downloaded LongMemEval file: mise run eval:longmemeval -- <file.json>"
# The data is never part of this repository (docs/retrieval-evaluation.md says where it comes from and why). Setting
# EVAL_EMBEDDINGS_URL and EVAL_EMBEDDINGS_MODEL adds the semantic and hybrid configurations, embedded by that provider.
usage = 'arg "<file>" help="A LongMemEval JSON file, such as longmemeval_s.json"'
run = """
#!/usr/bin/env bash
set -euo pipefail
for name in "${!MEMCASTLE_@}"; do unset "$name"; done
EVAL_LONGMEMEVAL="$(realpath "${usage_file?}")" \\
  cargo nextest run --test in_process --no-capture --run-ignored ignored-only -E 'test(retrieval_eval::explicit::an_explicit_longmemeval)'
"""
